<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }
      .canvas-container {
        border: 2px solid #ccc;
        display: inline-block;
        margin: 20px;
      }
      canvas {
        display: block;
      }
      .info {
        margin: 20px 0;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Canvas Drawing Test</h1>

    <div class="info">
      <p><strong>Instructions:</strong></p>
      <ul>
        <li>Click and drag on the canvas to draw</li>
        <li>Canvas size: 600x600 pixels</li>
        <li>Check console for debugging info</li>
      </ul>
    </div>

    <div class="canvas-container">
      <canvas id="testCanvas" width="600" height="600"></canvas>
    </div>

    <div class="info">
      <p><strong>Status:</strong> <span id="status">Ready to draw</span></p>
      <button onclick="clearCanvas()">Clear Canvas</button>
      <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
    </div>

    <script>
      const canvas = document.getElementById("testCanvas");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");

      let isDrawing = false;
      let paths = [];
      let currentPath = [];

      // Initialize canvas
      function initCanvas() {
        // Set white background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 600, 600);

        // Draw grid dots
        ctx.fillStyle = "#000000";
        for (let i = 0; i < 600; i += 20) {
          for (let j = 0; j < 600; j += 20) {
            ctx.beginPath();
            ctx.arc(i, j, 2, 0, 2 * Math.PI);
            ctx.fill();
          }
        }

        status.textContent = "Canvas initialized with dots";
        console.log("Canvas initialized");
      }

      // Mouse event handlers
      function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (600 / rect.width),
          y: (e.clientY - rect.top) * (600 / rect.height),
        };
      }

      function handleMouseDown(e) {
        isDrawing = true;
        const pos = getMousePos(e);
        currentPath = [pos];

        ctx.strokeStyle = "#a1a1a4";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);

        status.textContent = `Started drawing at (${Math.round(pos.x)}, ${Math.round(pos.y)})`;
        console.log("Mouse down at:", pos);
      }

      function handleMouseMove(e) {
        if (!isDrawing) return;

        const pos = getMousePos(e);
        currentPath.push(pos);

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);

        status.textContent = `Drawing to (${Math.round(pos.x)}, ${Math.round(pos.y)})`;
      }

      function handleMouseUp() {
        if (!isDrawing) return;

        isDrawing = false;
        if (currentPath.length > 1) {
          paths.push([...currentPath]);
          status.textContent = `Path completed with ${currentPath.length} points`;
          console.log("Path completed:", currentPath.length, "points");
        }
        currentPath = [];
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, 600, 600);
        paths = [];
        currentPath = [];
        initCanvas();
        status.textContent = "Canvas cleared";
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }

      // Event listeners
      canvas.addEventListener("mousedown", handleMouseDown);
      canvas.addEventListener("mousemove", handleMouseMove);
      canvas.addEventListener("mouseup", handleMouseUp);
      canvas.addEventListener("mouseleave", handleMouseUp);

      // Initialize
      initCanvas();
    </script>
  </body>
</html>
